name: Build and Test

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore Kite.slnx

      - name: Build
        run: dotnet build Kite.slnx --no-restore --configuration Release

      - name: Run unit tests
        run: dotnet test tests/Kite.Tests.Unit/Kite.Tests.Unit.csproj --no-build --no-restore --configuration Release --verbosity normal

      - name: Run integration tests
        run: dotnet test tests/Kite.Tests.Integration/Kite.Tests.Integration.csproj --no-build --no-restore --configuration Release --verbosity normal

      # Catches packaging regressions (missing metadata, non-packable dependencies)
      # on every push instead of at release time.
      - name: Pack
        run: dotnet pack Kite.slnx --no-build --no-restore --configuration Release --output ${{ runner.temp }}/packages

      - name: Upload packages as build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nuget-packages
          path: ${{ runner.temp }}/packages/*
